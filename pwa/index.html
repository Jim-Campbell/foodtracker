<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c2542a">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23c2542a'/%3E%3Ctext x='50' y='70' font-size='56' text-anchor='middle' fill='white' font-family='-apple-system,sans-serif' font-weight='bold'%3EF%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23c2542a'/%3E%3Ctext x='50' y='70' font-size='56' text-anchor='middle' fill='white' font-family='-apple-system,sans-serif' font-weight='bold'%3EF%3C/text%3E%3C/svg%3E">
<title>Food</title>
<style>
:root {
  --bg: #faf7f2; --card: #fff; --text: #201c18; --muted: #7a7168;
  --line: #e8e1d8; --primary: #c2542a; --green: #3a8f5c; --amber: #d99a2b; --red: #c2453b;
  --chip: #f1ece4; --chip-on: #c2542a; --shadow: 0 1px 3px rgba(0,0,0,.08);
  --green-tint: rgba(58,143,92,.15);
  --s-cardio: #c2542a; --s-strength: #d99a2b; --s-yoga: #3a8f5c; --s-med: #5271c4; --s-pt: #b5548f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15130f; --card: #211d18; --text: #ece6dd; --muted: #a49b8f;
    --line: #332d26; --chip: #2b2620; --shadow: 0 1px 3px rgba(0,0,0,.4);
    --green-tint: rgba(58,143,92,.28);
    --s-strength: #c08417; --s-pt: #c56ba0;
  }
}
* { box-sizing: border-box; margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text);
}
header {
  position: sticky; top: 0; z-index: 6; color: #fff;
  background: linear-gradient(150deg, #d05f30, #a8431f);
  padding: calc(9px + env(safe-area-inset-top)) 16px 9px;
  display: flex; align-items: center; justify-content: center;
}
header svg { height: 26px; width: auto; display: block; }
main { max-width: 480px; margin: 0 auto; padding: 14px 14px 190px; min-width: 0; }
.card { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; }
h2 { font-size: 1.05rem; margin-bottom: 10px; }
h3 { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; margin: 4px 0 6px; }
/* slot header: label left, slot totals right, a notch larger than row subtitles */
.slothead { display: flex; align-items: baseline; gap: 8px; }
.slothead h3 { margin-right: auto; }
.slotsum { font-size: .88rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.slotact { font-size: 1rem; line-height: 1; padding: 0 2px; color: var(--muted); background: none; border: none; cursor: pointer; }
.favsec { margin: 14px 0 4px; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.muted { color: var(--muted); }
.sm { font-size: .78rem; }
.big { font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.center { text-align: center; }
.empty { text-align: center; color: var(--muted); padding: 30px 0; font-size: .9rem; }
button { font-family: inherit; }
input, select { font-family: inherit; font-size: 16px; }
button.btn {
  border: none; border-radius: 10px; padding: 10px 15px; font-size: .88rem; font-weight: 600;
  cursor: pointer; background: var(--chip); color: var(--text);
}
button.btn.primary { background: var(--primary); color: #fff; }
button.btn.danger { background: var(--red); color: #fff; }
button.btn.ghost { background: none; color: var(--muted); }
.dlg-actions { display: flex; gap: 8px; margin-top: 14px; }
.dlg-actions .btn { flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; }
.chips button {
  border: none; border-radius: 16px; padding: 6px 13px; font-size: .8rem; cursor: pointer;
  background: var(--chip); color: var(--text);
}
.chips button.on { background: var(--chip-on); color: #fff; font-weight: 600; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin: 6px 0 2px; }
.qty button {
  border: none; background: var(--chip); color: var(--text);
  width: 34px; height: 30px; font-size: 1.15rem; line-height: 1; cursor: pointer;
}
.qty button:disabled { opacity: .35; cursor: default; }
.qty .val { min-width: 48px; text-align: center; font-size: .85rem; font-weight: 600; padding: 0 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; width: 100%; }
.seg button { flex: 1; border: none; background: var(--card); color: var(--text); padding: 8px 10px; font-size: .82rem; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: none; }
.seg button.on { background: var(--primary); color: #fff; font-weight: 600; }
label.f { display: block; font-size: .75rem; color: var(--muted); margin: 12px 0 4px; }
input[type=text], input[type=number], input[type=date] {
  width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 9px;
  background: var(--bg); color: var(--text);
}
.row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.row:last-child { border-bottom: none; }
.row .grow { flex: 1; min-width: 0; }
.row .m { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { font-size: .78rem; color: var(--muted); }
.thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
.lk { background: none; border: none; color: var(--red); cursor: pointer; font-size: 1rem; padding: 4px; }
.hint { background: var(--chip); border-radius: 10px; padding: 8px 12px; font-size: .82rem; margin-bottom: 10px; color: var(--muted); display: flex; align-items: flex-start; gap: 6px; cursor: pointer; }
.hint .hint-txt { flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hint.open .hint-txt { -webkit-line-clamp: unset; }
/* day nav */
.daynav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 12px; }
.daynav h2 { margin: 0; min-width: 130px; text-align: center; }
.arrow { border: 1px solid var(--line); background: var(--card); color: var(--text); width: 38px; height: 34px; border-radius: 9px; font-size: 1.15rem; cursor: pointer; }
.arrow:disabled { opacity: .3; cursor: default; }
/* hero */
.hero { text-align: center; position: relative; padding-top: 22px; }
.ringwrap { position: relative; width: 168px; height: 168px; margin: 0 auto; }
.ringwrap svg { width: 100%; height: 100%; }
.ring-bg { fill: none; stroke: var(--chip); stroke-width: 10; }
.ring-fg { fill: none; stroke-width: 10; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 60px 60px; transition: stroke-dashoffset .3s; }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-center .big { font-size: 2rem; }
.score-badge { position: absolute; top: 14px; right: 14px; color: #fff; font-weight: 700; font-size: .85rem; border-radius: 10px; padding: 3px 10px; border: none; cursor: pointer; font-family: inherit; }
.scorerow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.scorerow:last-child { border-bottom: none; }
.tierchip { color: #fff; font-weight: 700; font-size: .75rem; border-radius: 8px; padding: 3px 7px; flex-shrink: 0; min-width: 30px; text-align: center; }
.pbar { background: var(--chip); border-radius: 5px; height: 10px; margin: 18px 0 4px; overflow: hidden; }
.pbar-fill { height: 100%; transition: width .3s; }
.pbar-label { font-size: .8rem; color: var(--muted); }
/* macro pie + legend row in the day hero */
.macrorow { display: flex; align-items: center; gap: 16px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
.macrorow svg { flex-shrink: 0; }
.leg { font-size: .8rem; line-height: 1.5; display: flex; align-items: center; gap: 6px; }
.legdot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
/* outlier attribution line (item 6): a quiet flag on an off day */
.anomaly { padding: 12px 16px; }
.anomaly summary { font-size: .9rem; color: var(--text); cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; }
.anomaly summary::-webkit-details-marker { display: none; }
.anomaly-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); flex-shrink: 0; }
/* training card — one row per activity: icon, 7 day-boxes (Mon–Sun), goal circles */
/* icon is pinned to the left; a flexible spacer on each side of the day-box +
   circles cluster keeps that cluster centered in the leftover width. */
.trainweek { display: grid; grid-template-columns: 32px minmax(14px, 1fr) repeat(7, 26px) auto minmax(0, 1fr); column-gap: 3px; row-gap: 13px; align-items: center; position: relative; margin-top: 4px; }
.trainweek > :not(.ti-lane) { position: relative; z-index: 1; }
.ti-sp { pointer-events: none; }
/* pale vertical lane behind today's column (a touch wider than the boxes, no
   border). Geometry is set by positionTodayLane() after render — grid can't be
   trusted to size an absolutely-positioned item to a single column track. */
.ti-lane { position: absolute; background: var(--chip); border-radius: 8px; z-index: 0; opacity: .55; }
.ti-icon { width: 32px; height: 32px; border-radius: 9px; background: var(--chip); display: flex; align-items: center; justify-content: center; font-size: 1.02rem; cursor: pointer; }
.ti-icon.met { background: var(--green-tint); }
.ti-hdr { font-size: 11px; color: var(--muted); text-align: center; }
.ti-hdr.tdy { color: var(--text); font-weight: 600; }
.ti-box { width: 26px; height: 26px; border: 1.5px solid var(--line); border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.ti-box svg { display: block; }
/* marker for a day whose session carries a note — sits on the box's top-right
   corner with a card-colored ring so it separates from the border. */
.ti-note { position: absolute; top: -3px; right: -3px; width: 6px; height: 6px; border-radius: 50%; box-shadow: 0 0 0 1.5px var(--card); }
.ti-dot { width: 10px; height: 10px; border-radius: 50%; }
.ti-circles { display: flex; gap: 2px; align-items: center; margin-left: 7px; }
.ti-circle { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; }
.ti-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: .72rem; color: var(--muted); }
.ti-legend .lgi { display: inline-flex; align-items: center; gap: 4px; }
.qlSub { margin-bottom: 10px; }
input.qlCustom { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); margin-top: 4px; font-size: .85rem; }
textarea.qlNote { width: 100%; min-height: 52px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); margin-top: 4px; font-size: .85rem; font-family: inherit; resize: vertical; line-height: 1.35; }
/* minutes stepper: −/editable field/+ pill, reuses .qty from the portion control */
.qty.mins { margin: 4px 0 2px; }
.qty input.qtyIn { width: 46px; text-align: center; border: none; background: transparent; color: var(--text); font-size: .9rem; font-weight: 600; -moz-appearance: textfield; }
.qty input.qtyIn::-webkit-outer-spin-button, .qty input.qtyIn::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.qty .unit { font-size: .72rem; color: var(--muted); padding-right: 8px; }
/* HR-zone panel (cardio) */
.zbtn { width: 100%; text-align: left; margin-top: 4px; display: flex; gap: 8px; align-items: baseline; }
.zones { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.zrow { display: flex; align-items: center; gap: 8px; }
.zrow .zlab { width: 26px; font-weight: 600; font-size: .82rem; color: var(--s-cardio); }
.zrow input.zin { flex: 1; max-width: 90px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font-size: .85rem; }
/* item editor */
.itemlist { margin-bottom: 6px; }
.itemrow { border-bottom: 1px solid var(--line); padding: 10px 0; }
.itemrow:last-child { border-bottom: none; }
.irow-top { display: flex; align-items: flex-start; gap: 8px; }
.irow-mid { display: flex; align-items: center; gap: 10px; margin: 6px 0 2px; }
.gramsIn { width: 52px; padding: 6px 6px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--text); font-size: .85rem; }
.irow-mid .s { white-space: nowrap; }
/* confirm-the-match row (item 4): which DB entry backed the numbers */
.matchrow { margin: 4px 0 2px; font-size: .8rem; }
.matchrow.loud { background: color-mix(in srgb, var(--amber) 10%, transparent); border-radius: 8px; padding: 5px 7px; }
.mr-line { display: flex; align-items: center; gap: 7px; }
.mname { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mr-act { margin-left: auto; display: flex; gap: 4px; flex-shrink: 0; }
.dtbadge { font-size: .66rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; padding: 2px 6px; border-radius: 20px; color: #fff; background: var(--muted); white-space: nowrap; flex-shrink: 0; }
.dtbadge.t1, .dtbadge.t2 { background: var(--green); }
.dtbadge.t3 { background: var(--amber); }
.dtbadge.t4 { background: var(--red); }
.chg { color: var(--accent); font-weight: 600; }
.wchip { border: 1px solid var(--line); border-radius: 20px; padding: 1px 7px; font-size: .78rem; background: var(--bg); color: var(--muted); cursor: pointer; }
.wchip.on { background: var(--green); color: #fff; border-color: var(--green); }
.altlist { display: flex; flex-direction: column; gap: 4px; margin: 6px 0 2px; }
.altopt { display: flex; align-items: center; gap: 7px; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: .8rem; color: var(--text); cursor: pointer; }
.altopt:hover { border-color: var(--accent); }
/* meal photo in the detail dialog: cropped banner, tap to see the full shot */
.dphoto { width: 100%; max-height: 180px; object-fit: cover; border-radius: 10px; margin: 8px 0 10px; cursor: pointer; display: block; }
.dphoto.full { max-height: none; object-fit: contain; }
.dfoot { position: sticky; bottom: 0; background: var(--card); padding-top: 8px; }
.dtot { font-size: .95rem; text-align: center; }
/* bottom bar */
#bottomBar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--card); border-top: 1px solid var(--line); }
#logbar { display: none; align-items: flex-end; gap: 6px; padding: 10px 10px 8px; }
/* textarea so dictated text stays fully visible while correcting: grows to
   ~4 lines (autoGrowLogInput), then scrolls */
#logbar textarea { flex: 1; padding: 11px 12px; border: 1px solid var(--line); border-radius: 20px; background: var(--bg); color: var(--text); font-size: 16px; font-family: inherit; resize: none; overflow-y: auto; line-height: 1.35; height: 44px; }
.iconbtn { border: none; background: var(--chip); color: var(--text); width: 42px; height: 42px; border-radius: 50%; font-size: 1.15rem; cursor: pointer; flex-shrink: 0; }
.iconbtn.on { background: var(--red); color: #fff; }
.iconbtn.primary { background: var(--primary); color: #fff; }
#tabnav { display: flex; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
#tabnav button { flex: 1; border: none; background: none; color: var(--muted); padding: 8px 4px; font-size: .78rem; font-weight: 600; cursor: pointer; }
#tabnav button.on { color: var(--primary); }
/* trends */
.trendseg { margin-bottom: 12px; }
.avgrow { display: flex; justify-content: space-around; text-align: center; margin-bottom: 12px; }
.chart { width: 100%; height: auto; display: block; }
main.wide { max-width: 480px; }
.filterrow { display: flex; gap: 8px; margin-bottom: 12px; }
.filterrow .seg:first-child { flex: 1.2; }
.filterrow .seg:last-child { flex: 1; }
.trainlegend { display: flex; flex-wrap: wrap; gap: 10px 14px; justify-content: center; margin-top: 8px; font-size: .78rem; color: var(--muted); }
.trainlegend .leg { font-size: .78rem; }
.mixrow { display: flex; flex-direction: column; gap: 12px; }
.mixrow > .card { margin-bottom: 0; }
.stattile { display: flex; justify-content: space-around; gap: 10px; text-align: center; }
.stattile .big { font-size: 1.4rem; }
.hbar-row { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
.hbar-row .hbar-label { width: 44px; flex-shrink: 0; font-size: .78rem; color: var(--muted); }
.hbar-track { flex: 1; height: 14px; background: var(--chip); border-radius: 4px; overflow: hidden; position: relative; }
.hbar-fill { height: 100%; border-radius: 4px; }
.hbar-val { width: 34px; flex-shrink: 0; font-size: .78rem; text-align: right; font-variant-numeric: tabular-nums; }
.splitbar { display: flex; height: 16px; border-radius: 5px; overflow: hidden; margin: 8px 0 6px; }
.styletally { display: flex; gap: 10px; flex-wrap: wrap; font-size: .78rem; color: var(--muted); }
table.traintable { width: 100%; border-collapse: collapse; font-size: .78rem; margin-top: 8px; }
table.traintable th, table.traintable td { padding: 5px 4px; text-align: right; border-bottom: 1px solid var(--line); }
table.traintable th:first-child, table.traintable td:first-child { text-align: left; }
@media (min-width: 720px) {
  main.wide { max-width: 900px; }
  .mixrow { flex-direction: row; }
  .mixrow > .card { flex: 1; min-width: 0; }
}
/* misc */
.spinner { width: 32px; height: 32px; border: 3px solid var(--chip); border-top-color: var(--primary); border-radius: 50%; margin: 0 auto; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#toast {
  position: fixed; bottom: 132px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 20px;
  font-size: .85rem; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 30; max-width: 90vw;
}
#toast.show { opacity: 1; }
dialog {
  border: none; border-radius: 14px; background: var(--card); color: var(--text);
  width: min(440px, calc(100vw - 24px)); max-height: 86vh; overflow-y: auto;
  padding: 18px; box-shadow: 0 8px 40px rgba(0,0,0,.35); margin: auto;
}
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog.wide { width: min(520px, calc(100vw - 24px)); }
</style>

<body>
<header aria-label="Food">
  <svg viewBox="0 0 76 28" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
    <!-- fork -->
    <path d="M5.5 4v5a3.5 3.5 0 0 0 7 0V4"/>
    <path d="M9 4v8.5M9 13.5V24"/>
    <!-- plate -->
    <circle cx="38" cy="14" r="10"/>
    <circle cx="38" cy="14" r="4.6" stroke-opacity=".65" stroke-width="1.8"/>
    <!-- knife -->
    <path d="M67 4c-3.1 3.3-3.1 8.2 0 11.4V24"/>
  </svg>
</header>
<main id="main"></main>
<div id="bottomBar">
  <div id="logbar"></div>
  <nav id="tabnav"></nav>
</div>
<div id="toast"></div>
<dialog id="dlg"></dialog>

<script>
'use strict';
// ---------- state ----------
const S = {
  view: 'today',
  day: today(),
  summary: null,
  settings: null,
  health: { photos: false, ai: false },
  trendsRange: 'week',
  trendRows: null, trendWeights: null, trendStart: null, trendEnd: null,
  exercise: null,
  trendsTab: 'food', trainingRange: '6wk', trainingData: null,
};

// ---------- api ----------
function apiKey() { return localStorage.getItem('food_key') || ''; }
async function api(path, opts = {}) {
  opts.headers = Object.assign({ 'Authorization': 'Bearer ' + apiKey() }, opts.headers || {});
  if (opts.body && !(opts.body instanceof FormData)) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  const res = await fetch('/api' + path, opts);
  if (res.status === 401) { askKey(); throw new Error('unauthorized'); }
  if (!res.ok) {
    let msg = 'request failed';
    try { msg = (await res.json()).error || msg; } catch {}
    throw new Error(msg);
  }
  if (res.status === 204) return null;
  return res.json();
}
function askKey() {
  const k = prompt('Enter the Food API key:');
  if (k) { localStorage.setItem('food_key', k.trim()); boot(); }
}
// POST to an NDJSON-streaming endpoint (/parse, /analyze-photo): progress
// events go to onProgress, and the result event resolves the call.
async function apiStream(path, body, onProgress) {
  const res = await fetch('/api' + path, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + apiKey(), 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (res.status === 401) { askKey(); throw new Error('unauthorized'); }
  if (!res.ok) {
    let msg = 'request failed';
    try { msg = (await res.json()).error || msg; } catch {}
    throw new Error(msg);
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!line) continue;
      let ev;
      try { ev = JSON.parse(line); } catch { continue; }
      if (ev.type === 'progress' && onProgress) onProgress(ev.message);
      else if (ev.type === 'result') return ev.result;
      else if (ev.type === 'error') throw new Error(ev.error);
    }
  }
  throw new Error('connection dropped mid-parse');
}

const $ = s => document.querySelector(s);
function today() { return new Date().toLocaleDateString('sv-SE'); }
function addDays(dateStr, n) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  dt.setUTCDate(dt.getUTCDate() + n);
  return dt.toISOString().slice(0, 10);
}
function fmtDayHeader(d) {
  if (d === today()) return 'Today';
  if (d === addDays(today(), -1)) return 'Yesterday';
  const dt = new Date(d + 'T12:00:00');
  return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
function weekStart(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  const dow = dt.getUTCDay(); // 0 Sun..6 Sat
  dt.setUTCDate(dt.getUTCDate() - ((dow + 6) % 7)); // back to Monday
  return dt.toISOString().slice(0, 10);
}
function daysBetween(a, b) {
  const [ay, am, ad] = a.split('-').map(Number), [by, bm, bd] = b.split('-').map(Number);
  return Math.round((Date.UTC(by, bm - 1, bd) - Date.UTC(ay, am - 1, ad)) / 86400000);
}
function weekdayShort(d) { return new Date(d + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short' }); }
function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cap(s) { return s ? s[0].toUpperCase() + s.slice(1) : ''; }
function toast(msg, ms = 2400) {

  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms);

function ring(eatenCal, targetCal) {
  const pct = targetCal > 0 ? Math.min(eatenCal / targetCal, 1) : 0;
  const remaining = targetCal - eatenCal;
  const over = targetCal > 0 && remaining < 0;
  const r = 54, c = 2 * Math.PI * r, off = c * (1 - pct);
  // Over budget: the outer ring is the spent budget (amber, full) and an
  // inner red ring shows the overage as a fraction of the target.
  let color = 'var(--green)';
  if (over) color = 'var(--amber)';
  else if (targetCal > 0 && remaining <= targetCal * 0.1) color = 'var(--amber)';
  let inner = '';
  if (over) {
    const overPct = Math.min(-remaining / targetCal, 1);
    const r2 = 43, c2 = 2 * Math.PI * r2;
    inner = `<circle class="ring-bg" cx="60" cy="60" r="${r2}" style="stroke-width:7"/><circle class="ring-fg" cx="60" cy="60" r="${r2}" style="stroke:var(--red);stroke-width:7;stroke-dasharray:${c2};stroke-dashoffset:${c2 * (1 - overPct)}"/>`;
  }
  const label = over ? `+${Math.round(-remaining)}` : `${Math.round(remaining)}`;
  const sub = over ? 'over' : 'remaining';
  return `<div class="ringwrap">
    <svg viewBox="0 0 120 120"><circle class="ring-bg" cx="60" cy="60" r="${r}"/><circle class="ring-fg" cx="60" cy="60" r="${r}" style="stroke:${color};stroke-dasharray:${c};stroke-dashoffset:${off}"/>${inner}</svg>
    <div class="ring-center"><div class="big"${over ? ' style="color:var(--red)"' : ''}>${label}</div><div class="muted sm">${sub}</div></div>
  </div>`;
}
function proteinBar(eatenMg, targetMg) {
  const pct = targetMg > 0 ? Math.min(eatenMg / targetMg, 1) * 100 : 0;
  const over = targetMg > 0 && eatenMg >= targetMg;
  return `<div class="pbar"><div class="pbar-fill" style="width:${pct}%;background:${over ? 'var(--green)' : 'var(--primary)'}"></div></div>
  <div class="pbar-label">${Math.round(eatenMg / 1000)} / ${Math.round(targetMg / 1000)} g protein</div>`;
}
// Macro colors, shared by the day-view pie and the trends stack.
const MACRO_COLORS = { protein: 'var(--primary)', carbs: 'var(--amber)', fat: 'var(--muted)' };
function pieSVG(parts, size) {
  const total = parts.reduce((s, p) => s + p.val, 0);
  if (total <= 0) return '';
  const cx = 32, cy = 32, r = 30;
  let a0 = -Math.PI / 2;
  const paths = parts.filter(p => p.val > 0).map(p => {
    if (p.val === total) return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${p.color}"/>`;
    const a1 = a0 + (p.val / total) * 2 * Math.PI;
    const large = (a1 - a0) > Math.PI ? 1 : 0;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    a0 = a1;
    return `<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${p.color}"/>`;
  }).join('');
  return `<svg viewBox="0 0 64 64" width="${size}" height="${size}">${paths}</svg>`;
}
// macroRow: small pie of calorie share (protein 4 / carbs 4 / fat 9 kcal per
// gram) plus gram totals, and the fiber total alongside.
function macroRow(s) {
  const pg = Math.round(s.protein_mg / 1000), cg = Math.round(s.carbs_mg / 1000), fg = Math.round(s.fat_mg / 1000);
  const fiberG = Math.round(s.fiber_mg / 1000);
  const satG = Math.round((s.sat_fat_mg || 0) / 1000);
  const satTargetG = Math.round((s.sat_fat_target_mg || 0) / 1000);
  const pk = pg * 4, ck = cg * 4, fk = fg * 9;
  const tot = pk + ck + fk;
  if (tot <= 0) return '';
  const pct = k => Math.round(k * 100 / tot);
  const leg = (color, label, pctV, grams) =>
    `<div class="leg"><span class="legdot" style="background:${color}"></span>${label} <b>${pctV}%</b> · ${grams} g</div>`;
  // Saturated fat is a ceiling, not a share — cardiovascular target, shown
  // as actual / ceiling and reddened when over (item 5).
  const satOver = satTargetG > 0 && satG > satTargetG;
  const satLine = satTargetG > 0
    ? `<div class="leg"><span class="legdot" style="background:none;border:1.5px solid ${satOver ? 'var(--red)' : 'var(--muted)'}"></span>Sat fat · <b style="color:${satOver ? 'var(--red)' : 'inherit'}">${satG}</b> / ${satTargetG} g</div>`
    : '';
  return `<div class="macrorow">
    ${pieSVG([
      { val: pk, color: MACRO_COLORS.protein },

      ${leg(MACRO_COLORS.protein, 'Protein', pct(pk), pg)}

const SUPPORTS_SPEECH = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
let recognition = null, micOn = false, micBase = '', usedMicForCurrent = false;
function initSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  recognition = new SR();
  recognition.continuous = true; recognition.interimResults = true; recognition.lang = 'en-US';
  recognition.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript + ' ';
      else interim += e.results[i][0].transcript;
    }
    if (final) { micBase += final; usedMicForCurrent = true; }
    $('#logInput').value = (micBase + interim).trim();
    autoGrowLogInput();
  };
  recognition.onerror = (e) => {
    stopMic();
    if (e.error === 'not-allowed') toast('Microphone access denied.');
  };
  recognition.onend = () => { if (micOn) { try { recognition.start(); } catch {} } };
}
function toggleMic() { if (!recognition) return; micOn ? stopMic() : startMic(); }
function startMic() {

function downscaleImage(file, maxEdge, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      const scale = Math.min(1, maxEdge / Math.max(width, height));
      width = Math.round(width * scale); height = Math.round(height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob(blob => { URL.revokeObjectURL(url); blob ? resolve(blob) : reject(new Error('encode failed')); }, 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image load failed')); };
    img.src = url;
  });
}

function findFood(id) {

function itemTotals(items) {
  return items.reduce((t, it) => {
    const f = it.fraction_pct / 100;
    t.cal += Math.round(it.calories * f);
    t.protein += Math.round(it.protein_mg * f / 1000);
    t.carbs += Math.round(it.carbs_mg * f / 1000);
    t.fat += Math.round(it.fat_mg * f / 1000);

  }, { cal: 0, protein: 0, carbs: 0, fat: 0 });
}
// Discrete portion stops (percent of full portion): ¼ ½ ¾ 1 1½ 2 3.
const QTY_STOPS = [25, 50, 75, 100, 150, 200, 300];
const QTY_MIN = QTY_STOPS[0], QTY_MAX = QTY_STOPS[QTY_STOPS.length - 1];
// Move to the neighbouring stop in direction dir (+1/-1); snaps off-stop values.
function nextStop(cur, dir) {
  if (dir > 0) return QTY_STOPS.find(s => s > cur) ?? QTY_MAX;
  return [...QTY_STOPS].reverse().find(s => s < cur) ?? QTY_MIN;
}
const FRAC_GLYPH = { 25: '¼', 50: '½', 75: '¾' };
function fmtQty(pct) {

  return `${whole || !frac ? whole : ''}${frac}×`;
}
function qtyStepper(it, idx) {

    <button onclick="stepItemFraction(${idx},-1)" ${cur <= QTY_MIN ? 'disabled' : ''} title="Less">−</button>
    <span class="val">${fmtQty(cur)}</span>
    <button onclick="stepItemFraction(${idx},1)" ${cur >= QTY_MAX ? 'disabled' : ''} title="More">+</button>
  </div>`;
}
function draftItemRow(it, idx) {

  const eatenCal = Math.round(it.calories * it.fraction_pct / 100);
  const macro = (grams, key, letter) => `<span style="color:${MACRO_COLORS[key]}" title="${key}">${grams}g ${letter}</span>`;
  return `<div class="itemrow">
    <div class="irow-top">

      <span class="s">${eatenCal} cal · ${macro(eaten('protein_mg'), 'protein', 'P')} · ${macro(eaten('carbs_mg'), 'carbs', 'C')} · ${macro(eaten('fat_mg'), 'fat', 'F')}</span>

}
// matchRow (item 4): shows which database entry backed this food's numbers, with
// one-tap alternatives and a weighed-portion toggle. Never blocks the save.
// Tiers 1–2 (barcode/branded/Foundation/SR) confirm quietly; tiers 3–4
// (Survey/web/estimate) are shown loud so a shaky match gets a second look.
const DT_LABEL = { usda: '', off: 'Barcode', label: 'Label', web: 'Web', ai: 'Estimate', manual: 'Manual' };
function tierFor(dt) {
  if (!dt) return 2;
  if (/survey/i.test(dt)) return 3;
  if (/branded/i.test(dt)) return 1;
  return 2; // Foundation / SR Legacy
}
function matchRow(it, idx) {
  const dt = it.fdc_data_type || DT_LABEL[it.source] || '';
  if (!dt && !it.match_description) return '';
  const tier = it.resolution_tier || (it.source === 'ai' ? 4 : 2);
  const loud = tier >= 3;

  const nm = it.match_description ? `<span class="mname">${esc(it.match_description)}</span>` : '';
  const swap = alts.length ? `<button class="lk chg" onclick="toggleAlts(${idx})" title="Pick a different match">⇄</button>` : '';
  const weighed = it.portion_source === 'weighed';
  const wchip = `<button class="wchip ${weighed ? 'on' : ''}" onclick="toggleWeighed(${idx})" title="Mark this portion as weighed on a scale">⚖</button>`;
  const altList = it._showAlts && alts.length
    ? `<div class="altlist">${alts.map((a, ai) => `<button class="altopt" onclick="swapMatch(${idx},${ai})"><span class="dtbadge t${tierFor(a.fdc_data_type)}">${esc(a.fdc_data_type || '')}</span>${esc(a.description)}</button>`).join('')}</div>`
    : '';

    <div class="mr-line"><span class="dtbadge t${tier}">${esc(dt || 'matched')}</span>${nm}<span class="mr-act">${swap}${wchip}</span></div>

function toggleAlts(idx) { DRAFT.items[idx]._showAlts = !DRAFT.items[idx]._showAlts; renderDraftDialog(); }

// swapMatch replaces a food's backing entry with a chosen alternative and

function swapMatch(idx, altIdx) {

  for (const k of ['protein_mg', 'carbs_mg', 'fat_mg', 'fiber_mg', 'sat_fat_mg', 'sugar_mg', 'sodium_mg']) {

function cleanItem({ id, meal_id, match_description, alternatives, alternative_fdc_ids, _showAlts, ...rest }) { return rest; }

// ==================== TRENDS ====================
function fullRangeDays(start, end) { const days = []; let d = start; while (d <= end) { days.push(d); d = addDays(d, 1); } return days; }
function mergeRange(rows, days) {
  const map = Object.fromEntries(rows.map(r => [r.day, r]));
  return days.map(d => map[d] || { day: d, calories: 0, protein_mg: 0, carbs_mg: 0, fat_mg: 0, score: null, over_target: false });
}
async function loadTrends() {
  const end = today();
  const days = S.trendsRange === 'week' ? 7 : 30;
  const start = addDays(end, -(days - 1));
  const [rows, weights] = await Promise.all([
    api(`/range?start=${start}&end=${end}`),
    api(`/weights?start=${start}&end=${end}`),
  ]);
  S.trendRows = rows; S.trendWeights = weights; S.trendStart = start; S.trendEnd = end;
}
function setTrendsRange(r) { S.trendsRange = r; S.trendRows = null; render(); }
function jumpToDay(day) { S.day = day; goTab('today'); loadDay(day).then(render).catch(e => toast('Error: ' + e.message)); }

// barValueLabel puts a small value above a bar. Wide bars (week view) get a
// horizontal number; narrow ones (month view) rotate it vertical so 30 bars
// stay legible. Zero-value days get no label.
function barValueLabel(val, x, y, bw) {
  if (!val) return '';
  const cx = x + bw / 2;
  if (bw >= 18) return `<text x="${cx}" y="${y - 3}" font-size="8" text-anchor="middle" fill="var(--muted)">${val}</text>`;
  return `<text x="${cx + 2}" y="${y - 3}" font-size="6.5" text-anchor="start" fill="var(--muted)" transform="rotate(-90 ${cx + 2} ${y - 3})">${val}</text>`;
}
function calorieBars(rows, target) {
  const w = 320, h = 150, pad = 16;
  const maxVal = Math.max(target, ...rows.map(r => r.calories), 1) * 1.1;
  const bw = (w - 2 * pad) / rows.length;
  const bars = rows.map((r, i) => {
    const bh = maxVal > 0 ? (r.calories / maxVal) * (h - 2 * pad) : 0;
    const x = pad + i * bw;
    const y = h - pad - bh;
    const color = target > 0 && r.calories > target ? 'var(--red)' : 'var(--green)';
    const dotColor = r.score == null ? '' : (r.score >= 80 ? 'var(--green)' : r.score >= 60 ? 'var(--amber)' : 'var(--red)');
    // Score dot sits inside the top of the bar; the value label owns the
    // space above it.
    const dot = r.score != null ? `<circle cx="${x + bw / 2}" cy="${Math.min(y + 6, h - pad - 4)}" r="3" fill="${dotColor}" stroke="var(--card)" stroke-width="1"/>` : '';
    return `<rect x="${x + 1.5}" y="${y}" width="${Math.max(bw - 3, 1)}" height="${Math.max(bh, 1)}" rx="2" fill="${color}" style="cursor:pointer" onclick="jumpToDay('${r.day}')"/>${dot}${barValueLabel(r.calories, x, y, bw)}`;
  }).join('');
  const targetY = target > 0 ? h - pad - (target / maxVal) * (h - 2 * pad) : null;
  const targetLine = targetY != null ? `<line x1="${pad}" y1="${targetY}" x2="${w - pad}" y2="${targetY}" stroke="var(--muted)" stroke-dasharray="4 3"/>` : '';
  return `<svg viewBox="0 0 ${w} ${h}" class="chart">${targetLine}${bars}</svg>`;
}
// macroStackBars: per-day grams stacked protein (bottom) / carbs / fat, with
// the protein target as the dashed line. The value label above each stack is
// the protein grams, colored to match the bottom segment.
function macroStackBars(rows, targetMg) {
  const w = 320, h = 150, pad = 16;
  const grams = rows.map(r => ({
    p: Math.round(r.protein_mg / 1000),
    c: Math.round(r.carbs_mg / 1000),
    f: Math.round(r.fat_mg / 1000),
  }));
  const targetG = Math.round((targetMg || 0) / 1000);
  const maxVal = Math.max(targetG, ...grams.map(g => g.p + g.c + g.f), 1) * 1.1;
  const bw = (w - 2 * pad) / rows.length;
  const scale = v => (v / maxVal) * (h - 2 * pad);
  const bars = rows.map((r, i) => {
    const g = grams[i];
    if (g.p + g.c + g.f === 0) return '';
    const x = pad + i * bw, bx = x + 1.5, bwid = Math.max(bw - 3, 1);
    let yBase = h - pad, segs = '';
    for (const [key, val] of [['protein', g.p], ['carbs', g.c], ['fat', g.f]]) {
      if (!val) continue;
      const sh = Math.max(scale(val), 1);
      yBase -= sh;
      segs += `<rect x="${bx}" y="${yBase}" width="${bwid}" height="${sh}" fill="${MACRO_COLORS[key]}" style="cursor:pointer" onclick="jumpToDay('${r.day}')"/>`;
    }
    const label = barValueLabel(g.p, x, yBase, bw).replace('fill="var(--muted)"', 'fill="var(--primary)"');
    return segs + label;
  }).join('');
  const targetY = targetG > 0 ? h - pad - scale(targetG) : null;

function weightChart(weights, targetG) {
  if (!weights.length) return '<div class="empty">No weigh-ins in this range</div>';
  const w = 320, h = 150, pad = 16;
  const lbs = weights.map(x => x.weight_g / 453.592);
  let min = Math.min(...lbs), max = Math.max(...lbs);
  if (targetG) { min = Math.min(min, targetG / 453.592); max = Math.max(max, targetG / 453.592); }
  if (min === max) { min -= 1; max += 1; }
  const padV = (max - min) * 0.15; min -= padV; max += padV;
  const n = lbs.length;
  const x = i => pad + (n > 1 ? (i / (n - 1)) * (w - 2 * pad) : (w - 2 * pad) / 2);
  const y = v => h - pad - ((v - min) / (max - min)) * (h - 2 * pad);
  const pts = lbs.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  const dots = lbs.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--text)"/>`).join('');
  let ma = '';
  if (n >= 7) {
    const maPts = [];
    for (let i = 0; i < n; i++) {
      const s = Math.max(0, i - 6);
      const slice = lbs.slice(s, i + 1);
      const avg = slice.reduce((a, b) => a + b, 0) / slice.length;
      maPts.push(`${x(i)},${y(avg)}`);
    }
    ma = `<polyline points="${maPts.join(' ')}" fill="none" stroke="var(--primary)" stroke-width="2" opacity=".6"/>`;
  }
  const goalLine = targetG ? `<line x1="${pad}" y1="${y(targetG / 453.592)}" x2="${w - pad}" y2="${y(targetG / 453.592)}" stroke="var(--green)" stroke-dasharray="4 3"/>` : '';
  return `<svg viewBox="0 0 ${w} ${h}" class="chart">${goalLine}<polyline points="${pts}" fill="none" stroke="var(--text)" stroke-width="2"/>${ma}${dots}</svg>
    <div class="s muted">${lbs[0].toFixed(1)} → ${lbs[n - 1].toFixed(1)} lb</div>`;
}

async function loadTrainingTrends() {
  const weeksN = TRAINING_RANGES[S.trainingRange] || 6;
  const curWs = weekStart(today());
  const start = addDays(curWs, -7 * (weeksN - 1));
  const end = today();
  const sessions = await api(`/exercise?start=${start}&end=${end}`);
  const weeks = Array.from({ length: weeksN }, (_, i) => addDays(curWs, -7 * (weeksN - 1 - i)));
  S.trainingData = { sessions, weeks, curWs };
}
function aggregateWeek(sessions, ws) {
  const we = addDays(ws, 6);
  const inWeek = sessions.filter(s => s.day >= ws && s.day <= we);
  const byType = t => inWeek.filter(s => s.type === t);
  const sumMin = arr => arr.reduce((a, s) => a + (s.duration_min || 0), 0);
  const cardio = byType('cardio'), strength = byType('strength'), yoga = byType('yoga');
  const med = byType('meditation'), pt = byType('pt');
  const cardioMin = sumMin(cardio), yogaMin = sumMin(yoga), medMin = sumMin(med), ptMin = sumMin(pt);
  return {
    ws, we,
    cardio: { sessions: cardio.length, min: cardioMin },
    strength: { sessions: strength.length },
    yoga: { sessions: yoga.length, min: yogaMin },
    meditation: { days: new Set(med.map(s => s.day)).size, min: medMin },
    pt: { days: new Set(pt.map(s => s.day)).size, min: ptMin },

function trainingMinutesChart(weeks, aggs, curWs) {
  const n = weeks.length;

  const maxVal = Math.max(1, ...aggs.map(a => a.totalMin)) * 1.15;
  const bw = (w - 2 * padSide) / n;
  const barW = Math.max(bw - 6, 6);
  const scale = v => (v / maxVal) * chartH;
  let bars = '';
  aggs.forEach((a, i) => {
    const isCur = weeks[i] === curWs;
    const x = padSide + i * bw + (bw - barW) / 2;
    const present = TRAIN_SERIES.filter(s => s.min(a) > 0);
    let y = chartBottom;
    present.forEach((s, si) => {
      const val = s.min(a);
      const sh = Math.max(scale(val), 2);
      const segTop = y - sh;
      const isTop = si === present.length - 1;
      const rx = isTop ? 4 : 0;
      const fill = isCur ? 'none' : s.color;
      const stroke = isCur ? s.color : 'none';
      const cnt = s.count(a);
      const cntLabel = sh >= 16 && cnt
        ? `<text x="${x + barW / 2}" y="${segTop + sh / 2 + 3}" font-size="9" text-anchor="middle" fill="${isCur ? 'var(--text)' : '#fff'}">${cnt}</text>`
        : '';
      bars += `<g tabindex="0"><title>${s.label} · ${weekLabel(weeks[i])}: ${val} min, ${cnt} ${s.key === 'meditation' || s.key === 'pt' ? 'day' + (cnt === 1 ? '' : 's') : 'session' + (cnt === 1 ? '' : 's')}</title>` +
        `<rect x="${x}" y="${segTop}" width="${barW}" height="${sh}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="${isCur ? 1.5 : 0}"/>${cntLabel}</g>`;
      y = segTop - gap;
    });
    // x-axis
    let axisLabel = '';
    if (n <= 6) {
      axisLabel = `<text x="${x + barW / 2}" y="${axisLabelY}" font-size="7.5" text-anchor="middle" fill="var(--muted)">${weekLabel(weeks[i])}</text>`;
    } else if (i === 0 || monthShort(weeks[i]) !== monthShort(weeks[i - 1])) {

// Flatten the per-day rollup into a CSV (nutrition + exercise summary + weight).

  const cols = ['date', 'calories', 'protein_g', 'carbs_g', 'fat_g', 'fiber_g', 'sat_fat_g', 'sugar_g',

    'cardio_min', 'strength_sessions', 'yoga_min', 'meditation_min', 'pt_min', 'active_min'];
  const num = v => v == null ? '' : v;
  const rows = [cols.join(',')];
  for (const d of days) {
    const f = d.food, ex = d.exercise;
    rows.push([
      d.date,
      f ? f.calories : '', f ? f.protein_g : '', f ? f.carbs_g : '', f ? f.fat_g : '', f ? f.fiber_g : '',
      f ? f.sat_fat_g : '', f ? f.sugar_g : '', f ? f.sodium_mg : '',
      f ? f.protein_pct_calories : '', f ? num(f.quality_score) : '', d.calorie_target, d.sat_fat_target_g,
      num(d.weight_lb),
      ex ? ex.cardio_min : '', ex ? ex.strength_sessions : '', ex ? ex.yoga_min : '',
      ex ? ex.meditation_min : '', ex ? ex.pt_min : '', ex ? ex.active_min : '',
    ].join(','));
  }
  return rows.join('\n') + '\n';
}
function resetKey() { localStorage.removeItem('food_key'); location.reload(); }

// ---------- boot ----------
async function boot() {
  try { S.health = await api('/health'); } catch { S.health = { ok: false, photos: false, ai: false }; }
  buildLogBar();
  initSpeech();
  try {
    const [summary, settings, favorites] = await Promise.all([api('/day/' + S.day), api('/settings'), api('/favorites'), loadExercise()]);
    S.summary = summary; S.settings = settings; S.favorites = favorites;
  } catch (e) { if (e.message !== 'unauthorized') toast('Error: ' + e.message); }
  render();
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
if (!apiKey()) askKey(); else boot();
</script>
